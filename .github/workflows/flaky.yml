name: flaky

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test
      - name: Upload attempts
        if: always()
        run: npm run upload
        env:
          FLAKY_INGEST_URL: ${{ secrets.FLAKY_INGEST_URL }}
          FLAKY_INGEST_TOKEN: ${{ secrets.FLAKY_INGEST_TOKEN }}
